server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/support
    username: support
    password: support
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
support:
  top-k: 4
  confidence-threshold: 0.55   # below this, the query is escalated to a human
  history-size: 10             # previous messages included for follow-ups
  cors-origin: http://localhost:5173
